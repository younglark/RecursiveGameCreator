name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.11
          sh scripts/setup.sh --minimal
      - name: Offline regression tests
        run: .venv/bin/pytest
      - name: CLI and mock smoke check
        run: |
          .venv/bin/game-agent --help
          .venv/bin/game-agent start examples/mock.json --run-dir "$RUNNER_TEMP/rsi-mock"
          .venv/bin/game-agent status "$RUNNER_TEMP/rsi-mock"
          .venv/bin/game-agent report "$RUNNER_TEMP/rsi-mock"
          mv "$RUNNER_TEMP/rsi-mock" "$RUNNER_TEMP/relocated run"
          .venv/bin/game-agent resume "$RUNNER_TEMP/relocated run"
          .venv/bin/game-agent export-game "$RUNNER_TEMP/relocated run" --output "$RUNNER_TEMP/game-export"
      - name: Build distributions and verify wheel installation
        run: |
          uv build
          uv venv --python 3.12 "$RUNNER_TEMP/rsi-wheel"
          uv pip install --python "$RUNNER_TEMP/rsi-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          ./rsi-wheel/bin/game-agent --help
          ./rsi-wheel/bin/python - <<'PY'
          from importlib.resources import files
          package = files('game_agent_lite')
          resources = [
              'prompts/designer.md', 'prompts/builder.md',
              'prompts/player.md', 'prompts/reviewer.md',
              'bridges/game_agent_bridge.js', 'bridges/game_agent_bridge.gd',
              'harbor_support/preinstalled_codex.py',
          ]
          for name in resources:
              assert package.joinpath(name).is_file(), name
          print('Installed wheel includes all role and bridge resources.')
          PY
